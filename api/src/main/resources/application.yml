server:
  port: 8080

spring:
  application:
    name: pentaho-migration-api
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size:    50MB
      max-request-size: 100MB
  # ── Database ─────────────────────────────────────────────────────────────────
  # Defaults to H2 embedded (zero-config for dev/test).
  # For PostgreSQL, set environment variables:
  #   JDBC_URL=jdbc:postgresql://host:5432/pentaho_migration
  #   JDBC_USER=migration
  #   JDBC_PASSWORD=secret
  datasource:
    url:               ${JDBC_URL:jdbc:h2:mem:pentaho_migration;DB_CLOSE_DELAY=-1}
    username:          ${JDBC_USER:sa}
    password:          ${JDBC_PASSWORD:}
    driver-class-name: ${JDBC_DRIVER_CLASS:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Engine ────────────────────────────────────────────────────────────────────
engine:
  temp-dir:            ${java.io.tmpdir}
  execution-pool-size: 4
