server:
  port: 8080

spring:
  application:
    name: pentaho-migration-api
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size:    50MB
      max-request-size: 100MB
  # ── Database ─────────────────────────────────────────────────────────────────
  # Defaults to H2 embedded (zero-config for dev/test).
  # For PostgreSQL, set environment variables:
  #   JDBC_URL=jdbc:postgresql://host:5432/pentaho_migration
  #   JDBC_USER=migration
  #   JDBC_PASSWORD=secret
  datasource:
    url:               ${JDBC_URL:jdbc:h2:mem:pentaho_migration;DB_CLOSE_DELAY=-1}
    username:          ${JDBC_USER:sa}
    password:          ${JDBC_PASSWORD:}
    driver-class-name: ${JDBC_DRIVER_CLASS:org.h2.Driver}
  jpa:
    # Explicitly set dialect — Hibernate 6 auto-detection can fail in fat-JAR mode.
    # Override with JPA_DIALECT env var when switching to PostgreSQL:
    #   JPA_DIALECT=org.hibernate.dialect.PostgreSQLDialect
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

logging:
  file:
    name: ${LOG_FILE:logs/pentaho-migration.log}
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.pentaho.migration: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Engine ────────────────────────────────────────────────────────────────────
engine:
  temp-dir:            ${java.io.tmpdir}
  execution-pool-size: 4
