# Test profile — fresh H2 in-memory database per test run
spring:
  datasource:
    url:      jdbc:h2:mem:pentaho_migration_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
